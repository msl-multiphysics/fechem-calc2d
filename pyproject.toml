[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fechem-calc2d"
version = "0.0.0"
description = "2D post-processing helpers for FEChem FEM results"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "meshio",
    "pyvista",
    "matplotlib",
    "pillow",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
